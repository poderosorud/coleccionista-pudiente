<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura Rápida - El Coleccionista pudiente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b132b; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1c2541; border: 1px solid #3a506b; }
        .form-control, .form-select { background-color: #0b132b; color: #fff; border: 1px solid #3a506b; }
        .form-control:focus, .form-select:focus { background-color: #0b132b; color: #fff; border-color: #6fffe9; box-shadow: 0 0 0 0.25rem rgba(111, 255, 233, 0.25); }
        .btn-custom { background-color: #4ea8de; color: #fff; font-weight: bold; }
        .btn-custom:hover { background-color: #3a86b8; color: #fff; }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-lg p-4 rounded-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="text-info m-0">📥 Captura de Nuevo Auto</h2>
                        <div>
                            <a href="/admin.html" class="btn btn-outline-warning btn-sm me-2">⚙️ Inventario</a>
                            <a href="/" class="btn btn-outline-light btn-sm">🌐 Catálogo</a>
                        </div>
                    </div>

                    <form id="captureForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label">Modelo o Nombre del Auto</label>
                            <input type="text" class="form-control" id="title" name="title" required placeholder="Ej. Nissan Skyline GT-R R34">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label">Precio ($ MXN)</label>
                                <input type="number" step="0.01" class="form-control" id="price" name="price" required placeholder="0.00">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="stock" class="form-label">Stock</label>
                                <input type="number" class="form-control" id="stock" name="stock" value="1" min="1" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="brand_id" class="form-label">Marca</label>
                                <select class="form-select" id="brand_id" name="brand_id" required>
                                    <option value="">Cargando marcas...</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="category_id" class="form-label">Categoría</label>
                                <select class="form-select" id="category_id" name="category_id" required>
                                    <option value="">Cargando categorías...</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="image" class="form-label">📸 Fotografía Principal</label>
                            <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
                        </div>

                        <div class="mb-4">
                            <label for="additional_images" class="form-label">🖼️ Galería Detallada (Opcional, máx. 5 fotos)</label>
                            <input type="file" class="form-control" id="additional_images" name="additional_images" multiple accept="image/*">
                            <div class="form-text text-muted">Selecciona fotos de motor, interior o detalles (usa Ctrl para varias).</div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-custom btn-lg" id="btnCapture">Guardar en Base de Datos</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const brandSelect = document.getElementById('brand_id');
            const categorySelect = document.getElementById('category_id');
            const captureForm = document.getElementById('captureForm');
            const btnCapture = document.getElementById('btnCapture');

            try {
                const [brandsRes, categoriesRes] = await Promise.all([
                    fetch('/api/brands'),
                    fetch('/api/categories')
                ]);

                const brands = await brandsRes.json();
                const categories = await categoriesRes.json();

                brandSelect.innerHTML = '<option value="">Selecciona...</option>';
                brands.forEach(b => brandSelect.innerHTML += `<option value="${b.id}">${b.name}</option>`);

                categorySelect.innerHTML = '<option value="">Selecciona...</option>';
                categories.forEach(c => categorySelect.innerHTML += `<option value="${c.id}">${c.name}</option>`);
            } catch (err) {
                console.error('Error cargando listas:', err);
            }

            captureForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                btnCapture.disabled = true;
                btnCapture.textContent = 'Guardando permanentemente...';

                const formData = new FormData(captureForm);

                try {
                    const res = await fetch('/api/products', { method: 'POST', body: formData });
                    const result = await res.json();

                    if (result.success) {
                        alert('¡Vehículo y galería guardados con éxito!');
                        captureForm.reset();
                    } else {
                        alert('Error: ' + (result.message || 'No se pudo guardar'));
                    }
                } catch (err) {
                    console.error('Error:', err);
                    alert('Error de conexión.');
                } finally {
                    btnCapture.disabled = false;
                    btnCapture.textContent = 'Guardar en Base de Datos';
                }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
