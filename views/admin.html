<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión y Edición - El Coleccionista pudiente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; color: #212529; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-product { background: #fff; border: 1px solid #dee2e6; border-radius: 12px; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); margin-bottom: 1rem; }
        .img-thumb { width: 100%; height: 180px; object-fit: cover; border-top-left-radius: 12px; border-top-right-radius: 12px; }
        @media (min-width: 768px) {
            .img-thumb { height: 120px; border-top-left-radius: 12px; border-bottom-left-radius: 12px; border-top-right-radius: 0; }
        }
    </style>
</head>
<body>
    <div class="container my-3 my-md-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <h2 class="text-primary m-0">⚙️ Gestión de Inventario</h2>
            <div class="d-flex gap-2">
                <a href="/capture.html" class="btn btn-success flex-fill fw-bold">📥 Capturar Nuevo</a>
                <a href="/" class="btn btn-outline-secondary flex-fill fw-bold">🌐 Catálogo</a>
            </div>
        </div>

        <div id="productsContainer" class="row">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Cargando inventario...</p>
            </div>
        </div>
    </div>

    <!-- MODAL DE EDICIÓN -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content p-3">
                <div class="modal-header">
                    <h5 class="modal-title text-primary fw-bold">✏️ Editar Artículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm" enctype="multipart/form-data">
                        <input type="hidden" id="edit_id" name="id">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Modelo o Nombre</label>
                            <input type="text" class="form-control" id="edit_title" name="title" required>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Precio ($)</label>
                                <input type="number" step="0.01" class="form-control" id="edit_price" name="price" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Stock</label>
                                <input type="number" class="form-control" id="edit_stock" name="stock" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Marca</label>
                                <select class="form-select" id="edit_brand_id" name="brand_id" required></select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Categoría</label>
                                <select class="form-select" id="edit_category_id" name="category_id" required></select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">📸 Reemplazar Foto Principal (Opcional)</label>
                            <input type="file" class="form-control" id="edit_image" name="image" accept="image/*">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">🖼️ Añadir a la Galería Detallada (Opcional, máx. 5)</label>
                            <input type="file" class="form-control" id="edit_additional_images" name="additional_images" multiple accept="image/*">
                            <div class="form-text small text-muted">Las nuevas imágenes se sumarán a la galería existente de este artículo.</div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold" id="btnUpdate">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('productsContainer');
            const editModalEl = document.getElementById('editModal');
            const editModal = new bootstrap.Modal(editModalEl);
            const editForm = document.getElementById('editForm');
            const editBrandSelect = document.getElementById('edit_brand_id');
            const editCategorySelect = document.getElementById('edit_category_id');
            const btnUpdate = document.getElementById('btnUpdate');

            let brandsList = [];
            let categoriesList = [];

            async function loadSelects() {
                try {
                    const [bRes, cRes] = await Promise.all([fetch('/api/brands'), fetch('/api/categories')]);
                    brandsList = await bRes.json();
                    categoriesList = await cRes.json();
                } catch (err) {
                    console.error('Error cargando catálogos:', err);
                }
            }
            await loadSelects();

            async function loadInventory() {
                try {
                    const res = await fetch('/api/products');
                    const products = await res.json();
                    
                    if (products.length === 0) {
                        container.innerHTML = '<div class="col-12 text-center text-muted py-5">No hay autos registrados.</div>';
                        return;
                    }

                    container.innerHTML = '';
                    products.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'col-12 col-md-6 col-lg-4';
                        card.innerHTML = `
                            <div class="card-product">
                                <div class="row g-0 align-items-center">
                                    <div class="col-4 col-md-4">
                                        <img src="${p.image_path || 'https://via.placeholder.com/150'}" class="img-thumb" alt="${p.title}">
                                    </div>
                                    <div class="col-8 col-md-8 p-3">
                                        <h6 class="fw-bold text-dark mb-1">${p.title}</h6>
                                        <p class="text-muted small mb-1">${p.brand_name || 'Sin marca'} — ${p.category_name || 'Sin categoría'}</p>
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <span class="text-success fw-bold fs-5">$${Number(p.price).toFixed(2)}</span>
                                            <span class="badge bg-primary">Stock: ${p.stock}</span>
                                        </div>
                                        <div class="d-flex gap-2">
                                            <button class="btn btn-outline-primary btn-sm flex-fill fw-bold py-2" onclick='openEditModal(${JSON.stringify(p)})'>✏️ Editar</button>
                                            <button class="btn btn-outline-danger btn-sm flex-fill fw-bold py-2" onclick="deleteProduct(${p.id})">🗑️ Borrar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } catch (err) {
                    console.error('Error:', err);
                    container.innerHTML = '<div class="col-12 text-center text-danger">Error al conectar con la base de datos.</div>';
                }
            }

            window.openEditModal = (product) => {
                document.getElementById('edit_id').value = product.id;
                document.getElementById('edit_title').value = product.title;
                document.getElementById('edit_price').value = product.price;
                document.getElementById('edit_stock').value = product.stock;
                
                // Limpiar campos de archivo por si quedaron seleccionados previamente
                document.getElementById('edit_image').value = '';
                document.getElementById('edit_additional_images').value = '';

                editBrandSelect.innerHTML = '';
                brandsList.forEach(b => {
                    const opt = document.createElement('option');
                    opt.value = b.id;
                    opt.textContent = b.name;
                    if (b.id === product.brand_id) opt.selected = true;
                    editBrandSelect.appendChild(opt);
                });

                editCategorySelect.innerHTML = '';
                categoriesList.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name;
                    if (c.id === product.category_id) opt.selected = true;
                    editCategorySelect.appendChild(opt);
                });

                editModal.show();
            };

            editForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('edit_id').value;
                
                btnUpdate.disabled = true;
                btnUpdate.textContent = 'Actualizando en la nube...';

                try {
                    const formData = new FormData(editForm);

                    const res = await fetch(`/api/products/${id}`, { 
                        method: 'PUT', 
                        body: formData 
                    });
                    
                    const result = await res.json();

                    if (result.success) {
                        editModal.hide();
                        loadInventory();
                        alert('¡Artículo actualizado correctamente!');
                    } else {
                        alert('Error al actualizar: ' + (result.message || 'Desconocido'));
                    }
                } catch (err) {
                    console.error('Error de red al editar:', err);
                    alert('Error de conexión con el servidor al intentar actualizar.');
                } finally {
                    btnUpdate.disabled = false;
                    btnUpdate.textContent = 'Guardar Cambios';
                }
            });

            window.deleteProduct = async (id) => {
                if (confirm('¿Estás seguro de eliminar este vehículo?')) {
                    const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) loadInventory();
                }
            };

            loadInventory();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
