<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario - El Coleccionista pudiente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b132b; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1c2541; border: 1px solid #3a506b; }
        .table { color: #fff; }
        .table-dark { background-color: #1c2541; }
        .btn-custom { background-color: #00b4d8; color: #fff; font-weight: bold; }
        .btn-custom:hover { background-color: #0096c7; color: #fff; }
    </style>
</head>
<body>
    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-info">⚙️ Gestión de Inventario</h2>
            <div>
                <a href="/capture.html" class="btn btn-success me-2">📥 Ir a Captura Rápida</a>
                <a href="/" class="btn btn-outline-light">🌐 Ver Catálogo</a>
            </div>
        </div>

        <div class="card shadow p-4 rounded-4">
            <h4 class="mb-3 text-warning">Listado de Autos Registrados</h4>
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Modelo</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable">
                        <tr><td colspan="5" class="text-center">Cargando inventario...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tableBody = document.getElementById('inventoryTable');

            async function loadInventory() {
                try {
                    const res = await fetch('/api/products');
                    const products = await res.json();
                    
                    if (products.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="5" class="text-center">No hay autos registrados.</td></tr>';
                        return;
                    }

                    tableBody.innerHTML = '';
                    products.forEach(p => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><img src="${p.image_path || 'https://via.placeholder.com/60'}" width="50" height="50" style="object-fit:cover; border-radius:5px;"></td>
                            <td><strong>${p.title}</strong><br><small class="text-muted">${p.brand_name || ''} - ${p.category_name || ''}</small></td>
                            <td>$${Number(p.price).toFixed(2)}</td>
                            <td><span class="badge bg-info text-dark">${p.stock}</span></td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">🗑️ Eliminar</button>
                            </td>
                        `;
                        tableBody.appendChild(tr);
                    });
                } catch (err) {
                    console.error('Error al cargar inventario:', err);
                }
            }

            window.deleteProduct = async (id) => {
                if (confirm('¿Estás seguro de eliminar este vehículo?')) {
                    const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) {
                        loadInventory();
                    } else {
                        alert('No se pudo eliminar');
                    }
                }
            };

            loadInventory();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
